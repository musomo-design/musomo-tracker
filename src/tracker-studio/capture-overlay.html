<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select area</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      font-family: "Inter Variable", system-ui, sans-serif;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 18, 0.08);
    }
    .hint {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.88);
      color: #f8fafc;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      pointer-events: none;
      z-index: 3;
    }
    .selection {
      position: fixed;
      border: 2px solid #22c55e;
      background: rgba(34, 197, 94, 0.12);
      box-shadow: 0 0 0 9999px rgba(8, 12, 18, 0.08);
      display: none;
      z-index: 2;
    }
    .selection.is-active { display: block; }
    .size-label {
      position: absolute;
      left: 0;
      bottom: calc(100% + 6px);
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <div class="hint" id="hint">Drag to select an area · Esc to cancel</div>
  <div class="selection" id="selection"><span class="size-label" id="sizeLabel"></span></div>
  <script>
    const invoke = window.__TAURI__?.core?.invoke;
    const overlay = document.getElementById('overlay');
    const selection = document.getElementById('selection');
    const sizeLabel = document.getElementById('sizeLabel');
    const scale = window.devicePixelRatio || 1;
    let start = null;
    let dragging = false;

    function setHint(text) {
      document.getElementById('hint').textContent = text;
    }

    function updateRect(x, y, w, h) {
      selection.classList.add('is-active');
      selection.style.left = `${x}px`;
      selection.style.top = `${y}px`;
      selection.style.width = `${Math.max(0, w)}px`;
      selection.style.height = `${Math.max(0, h)}px`;
      sizeLabel.textContent = `${Math.round(w)} × ${Math.round(h)}`;
    }

    async function submitRegion(x, y, w, h) {
      if (!invoke) {
        setHint('Capture unavailable — restart the app.');
        return;
      }
      if (w < 4 || h < 4) return;
      try {
        await invoke('tracker_submit_capture_region', {
          region: { x: Math.round(x), y: Math.round(y), width: Math.round(w), height: Math.round(h), scale }
        });
      } catch (err) {
        setHint(String(err?.message || err || 'Capture failed'));
      }
    }

    async function cancelPick() {
      if (!invoke) return;
      try {
        await invoke('tracker_cancel_capture_region');
      } catch (_) {}
    }

    overlay.addEventListener('pointerdown', e => {
      dragging = true;
      start = { x: e.clientX, y: e.clientY };
      updateRect(start.x, start.y, 0, 0);
      overlay.setPointerCapture(e.pointerId);
    });

    overlay.addEventListener('pointermove', e => {
      if (!dragging || !start) return;
      const x = Math.min(start.x, e.clientX);
      const y = Math.min(start.y, e.clientY);
      const w = Math.abs(e.clientX - start.x);
      const h = Math.abs(e.clientY - start.y);
      updateRect(x, y, w, h);
    });

    overlay.addEventListener('pointerup', async e => {
      if (!dragging || !start) return;
      dragging = false;
      const x = Math.min(start.x, e.clientX);
      const y = Math.min(start.y, e.clientY);
      const w = Math.abs(e.clientX - start.x);
      const h = Math.abs(e.clientY - start.y);
      start = null;
      if (w >= 4 && h >= 4) {
        await submitRegion(x, y, w, h);
      } else {
        selection.classList.remove('is-active');
      }
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') void cancelPick();
    });
  </script>
</body>
</html>
