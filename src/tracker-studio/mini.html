<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musomo Tracker</title>
  <style>
    @font-face {
      font-family: "Inter Variable";
      src: url("./fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #0f1117;
      --panel: #171a21;
      --panel-2: #1c2029;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --paused: #fbbf24;
      --border: #2a3140;
      --font: "Inter Variable", Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-bold: 700;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--font);
      font-weight: var(--font-weight-regular);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .mini {
      height: 100%;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid var(--border);
    }
    .mini__drag {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: var(--font-weight-medium);
      cursor: grab;
    }
    .mini__project {
      font-size: 14px;
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini__client {
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      color: var(--muted);
      margin-top: -2px;
    }
    .mini__time {
      font-size: 28px;
      font-weight: var(--font-weight-bold);
      font-variant-numeric: tabular-nums;
      letter-spacing: normal;
      color: var(--accent);
      line-height: 1.15;
    }
    .mini__status {
      font-size: 11px;
      font-weight: var(--font-weight-medium);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: -4px;
    }
    .mini__status[data-state="running"] { color: var(--accent); }
    .mini__status[data-state="paused"] { color: var(--paused); }
    .mini__status[data-state="stopped"] { color: var(--muted); }
    .mini__surface {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }
    .mini__footer {
      margin-top: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .mini__actions {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .mini__actions button {
      -webkit-app-region: no-drag;
      flex: 1;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 6px;
      font-weight: var(--font-weight-medium);
      font-size: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .mini__actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #052e16;
    }
    .mini__actions button:hover { filter: brightness(1.05); }
    .mini__close {
      -webkit-app-region: no-drag;
      margin-top: 4px;
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 8px;
      font-weight: var(--font-weight-medium);
      font-size: 11px;
      cursor: pointer;
    }
    .mini__close:hover {
      background: var(--panel-2);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="mini">
    <div class="mini__surface" data-tauri-drag-region>
      <div class="mini__drag">Musomo Tracker · Mini</div>
      <div class="mini__project" id="project">Acme Website Redesign</div>
      <div class="mini__client" id="client">Acme Corporation</div>
      <div class="mini__time" id="time">00:00:00</div>
      <div class="mini__status" id="status" data-state="stopped">Stopped</div>
    </div>
    <div class="mini__footer">
      <div class="mini__actions">
        <button type="button" id="btnPause">Pause</button>
        <button type="button" id="btnStop">Stop</button>
        <button type="button" class="primary" id="btnExpand">Main</button>
      </div>
      <button type="button" class="mini__close" id="btnCloseMini" data-i18n="closeMiniTimerLink">Close mini timer</button>
    </div>
  </div>
  <script src="../i18n/locales.js"></script>
  <script src="../i18n/runtime.js"></script>
  <script src="./mini.js?v=1.3.31"></script>
</body>
</html>
