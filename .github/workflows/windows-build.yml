name: Windows Build

on:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer (unsigned)
        run: npm run tauri build -- --bundles nsis

      - name: Validate Windows artifacts
        shell: pwsh
        run: ./scripts/ci-windows-validate-artifacts.ps1

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: musomo-tracker-windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
