[[permission]]
identifier = "allow-tracker"
description = "Allows Musomo Tracker commands (timer, persistence, exports, stubs)."
commands.allow = [
    "get_system_locale",
    "update_app_menu",
    "open_tracker_studio",
    "open_tracker_mini",
    "close_tracker_mini",
    "tracker_notify_mini_action",
    "tracker_push_timer_state",
    "tracker_get_timer_state",
    "tracker_clear_timer_pending_commit",
    "tracker_discard_open_timer",
    "tracker_init",
    "tracker_reset_database",
    "tracker_list_archives",
    "tracker_create_backup",
    "tracker_delete_archive",
    "tracker_restore_archive",
    "tracker_upsert_client",
    "tracker_delete_client",
    "tracker_upsert_project",
    "tracker_delete_project",
    "tracker_upsert_task",
    "tracker_upsert_session",
    "tracker_delete_session",
    "tracker_save_settings",
    "tracker_save_brand_image",
    "tracker_import_brand_file",
    "save_downloaded_file",
    "read_file_bytes",
    "open_file",
    "compose_mail_with_attachment",
    "allow_app_exit",
    "tracker_confirm_dialog",
    "tracker_two_choice_dialog",
    "tracker_session_close_dialog",
    "tracker_is_pro_enabled",
    "tracker_pro_status",
    "tracker_activate_pro_license",
    "tracker_reorder_work_screenshots",
    "tracker_count_session_screenshots",
    "tracker_session_screenshots_on_delete",
    "tracker_capture_work_screenshot",
    "tracker_list_work_screenshots",
    "tracker_update_work_screenshot_note",
    "tracker_update_work_screenshot",
    "tracker_screenshot_jpeg_data_url",
    "tracker_screenshot_image_data_url",
    "tracker_screenshot_thumb_data_url",
    "tracker_submit_capture_region",
    "tracker_cancel_capture_region",
    "tracker_delete_work_screenshot",
    "tracker_link_work_screenshots",
    "tracker_link_session_screenshot_orphans",
    "tracker_work_screenshot_counts",
    "tracker_import_work_screenshots",
    "tracker_list_capture_monitors",
    "tracker_set_screenshot_capture_context",
    "tracker_get_screenshot_capture_context",
    "tracker_clear_screenshot_capture_context"
]
